<footer class="site-footer">
  <p>
    {{ site.Title }} · {{ now.Year }}
    {{- range where site.Sections.ByWeight "Params.footer" true }}
      · <a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>
    {{- end }}
    {{- with site.GetPage "/guides/editeur" }}
      · <a href="{{ .RelPermalink }}">Écrire un article</a>
    {{- end }}
  </p>
</footer>
