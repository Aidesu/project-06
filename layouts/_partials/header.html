<header class="site-header">
  <a class="brand" href="{{ site.Home.RelPermalink }}">{{ site.Title }}</a>
  <div class="header-actions">
    {{- /* Sur l'accueil, la recherche est dans le hero */}}
    {{ if not .IsHome }}{{ partial "search.html" (dict "variant" "header") }}{{ end }}
    {{- with site.GetPage "/guides/editeur" }}
    <a class="header-link" href="{{ .RelPermalink }}" aria-label="Écrire un article" title="Écrire un article"{{ if $.Eq . }} aria-current="page"{{ end }}>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="M12 20h9"/>
        <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>
      </svg>
    </a>
    {{- end }}
    {{ partial "header-links.html" . }}
  </div>
</header>
