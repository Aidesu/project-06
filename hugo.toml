# LittleWiki — configuration Hugo
baseURL = "https://wiki.deafiaa.com/"
title = "LittleWiki"
defaultContentLanguage = "fr"
enableRobotsTXT = true
capitalizeListTitles = false

[params]
  description = "Personal documentation - Docs-as-Code."

  # Liens affichés à droite du header (supprimer une ligne pour masquer l'icône)
  [params.social]
    github = "https://github.com/Aidesu"
    website = "https://deafiaa.com/"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[taxonomies]
  tag = "tags"
  category = "categories"

[markup]
  [markup.goldmark.renderer]
    unsafe = false
  [markup.highlight]
    codeFences = true
    guessSyntax = false
    noClasses = true
    style = "github-dark"
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[module]
  [module.hugoVersion]
    extended = true
    min = "0.146.0"
